<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cashfree Integration Test</title>
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .container {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }
        button:hover {
            background: #45a049;
        }
        .log {
            background: #f5f5f5;
            padding: 15px;
            margin-top: 20px;
            border-radius: 4px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
        .error {
            color: red;
        }
        .success {
            color: green;
        }
        input {
            padding: 8px;
            margin: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Cashfree Integration Test</h1>
        <p>Test your backend payment order API with Cashfree checkout</p>
        
        <div>
            <h3>1. Backend Configuration</h3>
            <input type="text" id="backendUrl" placeholder="Backend URL" value="http://localhost:3000" style="width: 300px;">
            <br>
            <input type="email" id="email" placeholder="Email" value="admin@freightrek.com">
            <input type="password" id="password" placeholder="Password" value="Admin@123">
            <button onclick="login()">🔐 Login</button>
            <span id="loginStatus"></span>
        </div>
        
        <div style="margin-top: 20px;">
            <h3>2. Create Payment Order</h3>
            <input type="number" id="amount" placeholder="Amount" value="100" min="1">
            <select id="paymentMethod">
                <option value="upi">UPI</option>
                <option value="card">Card</option>
                <option value="netbanking">Net Banking</option>
                <option value="wallet">Wallet</option>
            </select>
            <button onclick="createOrder()">💳 Create Order</button>
        </div>
        
        <div style="margin-top: 20px;">
            <h3>3. Environment</h3>
            <label>
                <input type="radio" name="mode" value="sandbox"> Sandbox (Test)
            </label>
            <label>
                <input type="radio" name="mode" value="production" checked> Production
            </label>
        </div>
        
        <div style="margin-top: 20px;">
            <button onclick="clearLogs()">🗑️ Clear Logs</button>
        </div>
        
        <div id="logs" class="log"></div>
    </div>

    <script>
        let token = null;
        let cashfree = null;
        
        function log(message, type = 'info') {
            const logsDiv = document.getElementById('logs');
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : '';
            logsDiv.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`;
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }
        
        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
        }
        
        // Initialize Cashfree
        function initCashfree() {
            const mode = document.querySelector('input[name="mode"]:checked').value;
            log(`🔧 Initializing Cashfree in ${mode} mode...`);
            
            try {
                cashfree = new Cashfree({
                    mode: mode
                });
                log(`✅ Cashfree initialized in ${mode} mode`, 'success');
            } catch (error) {
                log(`❌ Failed to initialize Cashfree: ${error.message}`, 'error');
            }
        }
        
        // Login
        async function login() {
            const backendUrl = document.getElementById('backendUrl').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            log(`🔐 Logging in to ${backendUrl}...`);
            
            try {
                const response = await fetch(`${backendUrl}/admin/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    token = data.token;
                    log(`✅ Login successful!`, 'success');
                    log(`Token: ${token.substring(0, 30)}...`);
                    document.getElementById('loginStatus').innerHTML = '<span style="color: green;">✓ Logged in</span>';
                } else {
                    log(`❌ Login failed: ${data.message}`, 'error');
                    document.getElementById('loginStatus').innerHTML = '<span style="color: red;">✗ Failed</span>';
                }
            } catch (error) {
                log(`❌ Login error: ${error.message}`, 'error');
                document.getElementById('loginStatus').innerHTML = '<span style="color: red;">✗ Error</span>';
            }
        }
        
        // Create Order
        async function createOrder() {
            if (!token) {
                log('❌ Please login first!', 'error');
                return;
            }
            
            initCashfree();
            
            const backendUrl = document.getElementById('backendUrl').value;
            const amount = parseInt(document.getElementById('amount').value);
            const paymentMethod = document.getElementById('paymentMethod').value;
            
            log(`💳 Creating payment order...`);
            log(`Amount: ₹${amount}, Method: ${paymentMethod}`);
            
            try {
                const response = await fetch(`${backendUrl}/api/wallet/create-payment-order`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ amount, paymentMethod })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    log(`✅ Order created successfully!`, 'success');
                    log(`Order ID: ${data.orderId}`);
                    log(`Session ID: ${data.sessionId.substring(0, 50)}...`);
                    log(`Session ID Length: ${data.sessionId.length} characters`);
                    
                    // Verify session ID
                    if (data.sessionId.length < 100) {
                        log(`⚠️ Warning: Session ID seems too short!`, 'error');
                    } else {
                        log(`✅ Session ID length looks good`, 'success');
                    }
                    
                    // Try to open Cashfree checkout
                    log(`\n🚀 Opening Cashfree checkout...`);
                    openCheckout(data.sessionId, data.orderId);
                } else {
                    log(`❌ Failed to create order: ${data.message}`, 'error');
                    if (data.error) {
                        log(`Error details: ${JSON.stringify(data.error, null, 2)}`, 'error');
                    }
                }
            } catch (error) {
                log(`❌ Order creation error: ${error.message}`, 'error');
            }
        }
        
        // Open Cashfree Checkout
        async function openCheckout(sessionId, orderId) {
            if (!cashfree) {
                log('❌ Cashfree not initialized!', 'error');
                return;
            }
            
            log(`📦 Session ID for Cashfree: ${sessionId.substring(0, 50)}...`);
            
            const checkoutOptions = {
                paymentSessionId: sessionId,
                redirectTarget: '_modal',
                onSuccess: (data) => {
                    log(`\n✅ Payment Successful!`, 'success');
                    log(`Order ID: ${data.orderId}`);
                    log(`Payment ID: ${data.paymentId}`);
                    log(`Transaction ID: ${data.transactionId}`);
                },
                onFailure: (error) => {
                    log(`\n❌ Payment Failed!`, 'error');
                    log(`Error: ${JSON.stringify(error, null, 2)}`);
                },
                onClose: () => {
                    log(`\n⚠️ Payment popup closed by user`);
                }
            };
            
            try {
                log(`🔄 Calling cashfree.checkout()...`);
                await cashfree.checkout(checkoutOptions);
                log(`✅ Checkout initialized`, 'success');
            } catch (error) {
                log(`\n❌ Checkout Error: ${error.message}`, 'error');
                log(`Error details: ${JSON.stringify(error, null, 2)}`, 'error');
                
                // Common issues
                if (error.message.includes('invalid')) {
                    log(`\n🔍 Possible Issues:`, 'error');
                    log(`1. Environment mismatch (sandbox vs production)`, 'error');
                    log(`2. Session ID expired`, 'error');
                    log(`3. Invalid API credentials on backend`, 'error');
                }
            }
        }
        
        // Initialize on load
        window.addEventListener('load', () => {
            log('🧪 Cashfree Integration Test Tool Ready');
            log('1. Click "Login" to authenticate');
            log('2. Enter amount and select payment method');
            log('3. Click "Create Order" to test');
            log('\n📋 Make sure your backend server is running!');
        });
    </script>
</body>
</html>
